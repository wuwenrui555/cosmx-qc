[project]
name = "cosmx-qc"
version = "0.2.0"
description = "Quarto-based QC report tool for CosMx spatial-transcriptomics flatfiles"
authors = [
    {name = "Wenrui Wu", email = "wuwenruiwwr@outlook.com"},
]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "ipykernel>=7.0.1",
    "matplotlib>=3.9",
    "nbclient>=0.7",
    "nbformat>=5.7",
    "numpy>=1.24",
    "pandas>=2.3.3",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=7",
    "pytest-mpl>=0.16",
    "ruff>=0.7",
]

[project.scripts]
cosmx-qc = "cosmx_qc.cli:main"

[project.urls]
Homepage = "https://github.com/wuwenrui555/cosmx-qc"
Repository = "https://github.com/wuwenrui555/cosmx-qc"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"cosmx_qc" = ["report.qmd"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line-length already handled by formatter

[tool.ruff.format]
quote-style = "double"
